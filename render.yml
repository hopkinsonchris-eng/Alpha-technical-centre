services:
  - type: web
    name: alpha-technical-centre
    runtime: static
    staticPublishPath: .
    buildCommand: ""
    routes:
      - type: redirect
        source: /BOE
        destination: /financial-modelling.html
      - type: rewrite
        source: /
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The calculator modules under /js are not fingerprinted, so a year-long
      # immutable cache would let a stale module sit alongside a fresh page and
      # quietly disagree with it. They revalidate on every load instead: a 304
      # costs nothing and the page and its calculator always match.
      - path: /js/*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
