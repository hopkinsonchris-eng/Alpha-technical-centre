services:
  - type: web
    name: alpha-technical-centre
    runtime: static
    staticPublishPath: .
    buildCommand: ""
    routes:
      - type: redirect
        source: /BOE
        destination: /financial-modelling.html
      - type: rewrite
        source: /
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The calculator modules under /js are not fingerprinted, so a year-long
      # immutable cache would let a stale module sit alongside a fresh page and
      # quietly disagree with it. They revalidate on every load instead: a 304
      # costs nothing and the page and its calculator always match.
      - path: /js/*
        name: Cache-Control
        value: public, max-age=0, must-revalidate

  # Vault API (M01). Root directory vault/; migrations run on boot.
  - type: web
    name: atc-vault-api
    runtime: node
    rootDir: vault
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CF_ACCESS_TEAM_DOMAIN
        sync: false
      - key: CF_ACCESS_AUD
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN
        value: alpha-technical-centre.com

  # Nightly staleness (M08): recomputes stale flags on runs and documents.
  - type: cron
    name: atc-vault-nightly-staleness
    runtime: node
    rootDir: vault
    schedule: "15 3 * * *"
    buildCommand: npm ci
    startCommand: npx tsx src/jobs/nightly-staleness.ts
    envVars:
      - key: DATABASE_URL
        sync: false
