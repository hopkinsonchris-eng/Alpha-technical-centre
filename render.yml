services:
  - type: web
    name: alpha-technical-centre
    runtime: static
    staticPublishPath: .
    buildCommand: ""
    routes:
      - type: redirect
        source: /BOE
        destination: /financial-modelling.html
      # The Hub is a directory: at /hub (no slash) its relative stylesheet and script would
      # resolve to the site root. Cloudflare Access's launcher links to /hub.
      - type: redirect
        source: /hub
        destination: /hub/
      - type: rewrite
        source: /
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The calculator modules under /js are not fingerprinted, so a year-long
      # immutable cache would let a stale module sit alongside a fresh page and
      # quietly disagree with it. They revalidate on every load instead: a 304
      # costs nothing and the page and its calculator always match.
      - path: /js/*
        name: Cache-Control
        value: public, max-age=0, must-revalidate

  # Vault API (M01). Root directory vault/; migrations run on boot.
  - type: web
    name: atc-vault-api
    runtime: node
    rootDir: vault
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: VAULT_STORAGE
        value: supabase
      - key: VAULT_STORAGE_BUCKET
        value: vault
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CF_ACCESS_TEAM_DOMAIN
        sync: false
      - key: CF_ACCESS_AUD
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN
        value: alpha-technical-centre.com
      - key: VAULT_PUBLIC_URL
        value: https://www.alpha-technical-centre.com
      # wave 6: each person's mailbox by consent (vault/SETUP.md §7)
      - key: ZOHO_MAIL_CLIENT_ID
        sync: false
      - key: ZOHO_MAIL_CLIENT_SECRET
        sync: false
      - key: VAULT_TOKEN_KEY
        sync: false

  # Nightly staleness (M08): recomputes stale flags on runs and documents.
  - type: cron
    name: atc-vault-nightly-staleness
    runtime: node
    rootDir: vault
    schedule: "15 3 * * *"
    buildCommand: npm ci
    startCommand: npx tsx src/jobs/nightly-staleness.ts
    envVars:
      - key: DATABASE_URL
        sync: false

  # Project figures (wave 7 PR3, S1): one dated, unit-bearing figure per project and job from the newest
  # non-superseded run and the register, after the staleness pass so `stale` is current when copied.
  - type: cron
    name: atc-vault-figures
    runtime: node
    rootDir: vault
    schedule: "30 3 * * *"
    buildCommand: npm ci
    startCommand: npx tsx src/jobs/figures.ts
    envVars:
      - key: DATABASE_URL
        sync: false

  # APEX Asset Intelligence snapshot (M05, D6): files saved formations as runs
  # until the app pushes them itself. Needs APP_TOKENS, APEX_AI_BASE_URL, APEX_AI_TOKEN.
  - type: cron
    name: atc-vault-apex-snapshot
    runtime: node
    rootDir: vault
    schedule: "45 3 * * *"
    buildCommand: npm ci
    startCommand: npx tsx src/jobs/apex-snapshot.ts
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_TOKENS
        sync: false
      - key: APEX_AI_BASE_URL
        sync: false
      - key: APEX_AI_TOKEN
        sync: false

  # Ingest sync (M09): WorkDrive and Zoho Books, then chunk anything new.
  - type: cron
    name: atc-vault-ingest-sync
    runtime: node
    rootDir: vault
    schedule: "*/15 * * * *"
    buildCommand: npm ci
    startCommand: npx tsx src/jobs/ingest-sync.ts
    envVars:
      - key: VAULT_STORAGE
        value: supabase
      - key: VAULT_STORAGE_BUCKET
        value: vault
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

  # Mail poll (M10): Zoho Mail and Gmail cursors every five minutes.
  - type: cron
    name: atc-vault-mail-poll
    runtime: node
    rootDir: vault
    schedule: "*/5 * * * *"
    buildCommand: npm ci
    startCommand: npx tsx src/jobs/mail-poll.ts
    envVars:
      - key: ZOHO_MAIL_CLIENT_ID
        sync: false
      - key: ZOHO_MAIL_CLIENT_SECRET
        sync: false
      - key: VAULT_TOKEN_KEY
        sync: false
      - key: VAULT_STORAGE
        value: supabase
      - key: VAULT_STORAGE_BUCKET
        value: vault
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

  # Research sync (wave 4): finishes research runs the API server queued but a restart left behind.
  # Needs the same World Monitor and model keys as the web service; Render asks for them on sync.
  - type: cron
    name: atc-vault-research
    runtime: node
    rootDir: vault
    schedule: "*/15 * * * *"
    buildCommand: npm ci
    startCommand: npx tsx src/jobs/research.ts
    envVars:
      - key: VAULT_STORAGE
        value: supabase
      - key: VAULT_STORAGE_BUCKET
        value: vault
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WORLD_MONITOR_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: S2_API_KEY
        sync: false

  # Miners (M11): papers weekly; regulator feeds in the first week of the month.
  - type: cron
    name: atc-vault-miners
    runtime: node
    rootDir: vault
    schedule: "20 4 * * 1"
    buildCommand: npm ci
    startCommand: npx tsx src/jobs/miners.ts
    envVars:
      - key: VAULT_STORAGE
        value: supabase
      - key: VAULT_STORAGE_BUCKET
        value: vault
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: S2_API_KEY
        sync: false

  # Weekly dream (M15): proposes lessons into the review queue.
  - type: cron
    name: atc-vault-weekly-dream
    runtime: node
    rootDir: vault
    schedule: "0 5 * * 0"
    buildCommand: npm ci
    startCommand: npx tsx src/jobs/dream.ts
    envVars:
      - key: DATABASE_URL
        sync: false
